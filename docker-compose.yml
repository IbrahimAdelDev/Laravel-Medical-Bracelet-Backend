version: '3.8'

services:
  app:
    user: "${UID}:${GID}"

    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}

    container_name: medical_bracelet_app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - db
      - redis

    networks:
      - medical_bracelet_network

  web:
    image: nginx:alpine
    container_name: medical_bracelet_nginx
    restart: unless-stopped
    ports:
      - "8000:80" 
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - medical_bracelet_network

  db:
    image: mysql:8.0
    container_name: medical_bracelet_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - medical_bracelet_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: medical_bracelet_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - medical_bracelet_network

  redis:
    image: redis:alpine
    container_name: medical_bracelet_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - medical_bracelet_network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    container_name: medical_bracelet_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host="0.0.0.0" --port=8080 --debug
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    networks:
      - medical_bracelet_network

  queue_worker:
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    container_name: medical_bracelet_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
      - db
      - ai_service
    networks:
      - medical_bracelet_network
      
  ai_service:
    build:
      context: ./ai_service
    container_name: medical_ai_service
    ports:
      - "8001:8000"
    volumes:
      - ./ai_service:/app
    networks:
      - medical_bracelet_network

networks:
  medical_bracelet_network:
    driver: bridge

volumes:
  db_data:
  redis_data: