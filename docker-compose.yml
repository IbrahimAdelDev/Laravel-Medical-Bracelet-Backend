version: '3.8'

services:
  app:
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: medical_bracelet_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - medical_bracelet_network

  web:
    image: nginx:alpine
    container_name: medical_bracelet_nginx
    restart: unless-stopped
    ports:
      - "8000:80" 
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - medical_bracelet_network

  db:
    image: mysql:8.0
    container_name: medical_bracelet_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - medical_bracelet_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: medical_bracelet_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - medical_bracelet_network

  redis:
    image: redis:alpine
    container_name: medical_bracelet_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - medical_bracelet_network

  # ... خدماتك الحالية (laravel, mysql, redis, etc) ...
  ai_service:
    build:
      context: ./ai_service
    container_name: medical_ai_service
    ports:
      - "8001:8000"
    volumes:
      - ./ai_service:/app
    networks:
      - medical_bracelet_network # نفس شبكة لارافيل ليتمكنوا من التواصل

networks:
  medical_bracelet_network:
    driver: bridge

volumes:
  db_data:
  redis_data: